name: _probe-xhs-cloud

# A2 实验：用真实登录 cookie + xhshow 纯算法签名，从 GitHub Actions（Azure 机房 IP）
# 调小红书搜索接口。通过 = 云端可采集；461/300011 = 只能走住宅 IP。
# 实验结束后删除本文件。
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "关键词，逗号分隔"
        required: false
        default: "基金,黄金"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet requests xhshow

      - name: 出口 IP
        run: curl -s https://ipinfo.io/json | head -c 260; echo

      - name: 采集探针
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: |
          python scripts/probe_xhs_cloud.py \
            --keywords "${{ github.event.inputs.keywords }}" --show 3
