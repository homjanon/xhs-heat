name: publish

# 触发方式（刻意不用 GitHub schedule：实测延迟可达 2h48m，且与手动触发并存会双跑）：
#   1) Cloudflare Worker qdii-dispatch 心跳 → workflow_dispatch（collect=yes）→ 采集 + 处理 + 发布
#   2) 手动补跑：collect=no 走现有 inbox；collect=yes 重新采集
#   3) push inbox/** → 只处理不采集（比如本地导入了数据）
on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:
    inputs:
      date:
        description: "报告日期 YYYY-MM-DD（留空=今天）"
        required: false
      mode:
        description: "运行模式"
        required: false
        default: "auto"
        type: choice
        options: [auto, no-llm, reference-only]
      collect:
        description: "是否先跑小红书采集（run=采集，skip=只处理已有 inbox）"
        required: false
        default: "run"
        type: choice
        options: ["run", "skip"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet -r requirements.txt

      - name: Smoke test（配置/词典/prompt 守门，不联网）
        run: python scripts/smoke_test.py

      - name: 小红书采集（云端，cookie 失效会在这里报出来）
        id: collect
        if: github.event_name == 'workflow_dispatch' && inputs.collect != 'skip' && inputs.mode != 'reference-only'
        continue-on-error: true
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: |
          set -o pipefail
          python scripts/fetch_xhs.py --date "${{ inputs.date }}" 2>&1 | tee /tmp/collect.log
          code=${PIPESTATUS[0]}
          echo "collect_exit=$code" >> $GITHUB_OUTPUT
          exit $code

      - name: 采集结果检查（失败必须显式告警，不许静默）
        if: github.event_name == 'workflow_dispatch' && inputs.collect != 'skip' && inputs.mode != 'reference-only'
        run: |
          CODE="${{ steps.collect.outputs.collect_exit }}"
          echo "collect_exit=$CODE"
          if [ "$CODE" = "3" ]; then
            echo "::warning title=cookie 失效::XHS_COOKIE 已过期或非登录态，本地跑 scripts/get_xhs_cookie.py 重新扫码后更新 Secret"
          elif [ "$CODE" = "4" ]; then
            echo "::warning title=风控冷却::本轮连续 461，已跳过采集（看板将输出 stale 版）"
          elif [ "$CODE" = "2" ]; then
            echo "::notice title=部分成功::有失败关键词，详见 docs/data/reports/collect_*.json"
          fi

      - name: 处理并发布
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          set -e
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "no-llm" ]; then
            python scripts/fetch_heat.py $DATE_ARG --no-llm
          elif [ "$MODE" = "reference-only" ]; then
            python scripts/fetch_heat.py $DATE_ARG --reference-only
          else
            python scripts/fetch_heat.py $DATE_ARG
          fi

      - name: 存储清理（到期/超量，只动 inbox 与产物目录）
        run: python scripts/retention.py

      - name: 提交产物
        run: |
          set -e
          git config user.name  "xhs-heat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 热度榜 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 与远端对齐后再推（并发/多触发时避免 non-fast-forward）
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push 失败，第 $i 次重试…"; sleep 5
          done

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 本轮结果"
            echo ""
            echo "- 采集退出码：${{ steps.collect.outputs.collect_exit }}"
            ls -lh docs/latest.json docs/data/events.json 2>/dev/null || true
          } >> $GITHUB_STEP_SUMMARY
